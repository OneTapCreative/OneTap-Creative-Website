name: Validate OneTap SEO System

on:
  pull_request:
    paths:
      - "seo-system/**"
      - ".github/workflows/validate-seo-system.yml"
  push:
    branches:
      - main
    paths:
      - "seo-system/**"

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python seo-system/scripts/self_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-system-self-test-report
          path: seo-system/examples/sample-site/seo-output/

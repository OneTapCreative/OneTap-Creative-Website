name: Apply static OneTap launch resilience

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-resilience:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out static resilience branch
        uses: actions/checkout@v4
        with:
          ref: agent/static-hard-launch-resilience
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply static fixes
        run: python scripts/apply-static-launch-resilience.py

      - name: Validate release
        run: python scripts/audit-public-launch.py

      - name: Commit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html onboarding/index.html scripts/audit-public-launch.py
          git diff --cached --quiet && exit 0
          git commit -m "Harden static lead and onboarding delivery"
          git push origin HEAD:agent/static-hard-launch-resilience

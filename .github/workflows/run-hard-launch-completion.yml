name: Run OneTap hard-launch completion

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-hard-launch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hard-launch branch
        uses: actions/checkout@v4
        with:
          ref: agent/hard-launch-completion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate production release and operating kit
        run: python scripts/complete-hard-launch.py

      - name: Run public launch audit
        run: python scripts/audit-public-launch.py

      - name: Commit generated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css script.js terms.html privacy.html thank-you.html robots.txt sitemap.xml launch-config.json onboarding client-operations launch scripts/audit-public-launch.py .github/workflows/validate-public-launch.yml
          git diff --cached --quiet && exit 0
          git commit -m "Complete OneTap hard-launch website and client workflow"
          git push origin HEAD:agent/hard-launch-completion

# Triggered after workflow activation.

name: Visual Refresh QA

on:
  push:
    branches:
      - agent/sectioned-visual-refresh

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/onetap-http.log 2>&1 &
          sleep 2
      - name: Install browser driver
        run: npm install --no-save playwright-core
      - name: Capture responsive screenshots
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({headless:true, executablePath:'/usr/bin/google-chrome'});
          for (const [name,width,height] of [['desktop',1440,1100],['mobile',390,844]]) {
            const page = await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
            await page.evaluate(() => {
              document.querySelectorAll('.reveal').forEach(el => el.classList.add('visible'));
            });
            await page.waitForTimeout(1200);
            await page.screenshot({path:`${name}-top.png`});
            await page.screenshot({path:`${name}-full.png`,fullPage:true});
            await page.close();
          }
          await browser.close();
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: visual-refresh-qa
          path: |
            desktop-top.png
            desktop-full.png
            mobile-top.png
            mobile-full.png

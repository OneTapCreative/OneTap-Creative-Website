name: Agreement Page QA

on:
  push:
    branches:
      - agent/client-agreement-page

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/onetap-http.log 2>&1 &
          sleep 2
      - name: Install browser driver
        run: npm install --no-save playwright-core
      - name: Capture agreement screenshots
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          const browser = await chromium.launch({headless:true, executablePath:'/usr/bin/google-chrome'});
          for (const [name,width,height,url] of [
            ['desktop',1440,1100,'http://127.0.0.1:4173/agreement.html?plan=grow&name=Test%20Client&business=Test%20Business&email=test@example.com'],
            ['mobile',390,844,'http://127.0.0.1:4173/agreement.html?plan=start&name=Test%20Client&business=Test%20Business&email=test@example.com']
          ]) {
            const page = await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            await page.goto(url, {waitUntil:'networkidle'});
            await page.screenshot({path:`${name}-agreement-top.png`});
            await page.screenshot({path:`${name}-agreement-full.png`,fullPage:true});
            await page.close();
          }
          await browser.close();
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: agreement-page-qa
          path: |
            desktop-agreement-top.png
            desktop-agreement-full.png
            mobile-agreement-top.png
            mobile-agreement-full.png

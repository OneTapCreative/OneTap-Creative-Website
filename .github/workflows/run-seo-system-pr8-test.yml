name: Run SEO system PR 8 validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-review-branch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out SEO review branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-client-seo-system-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run exact branch self-test and capture result
        run: |
          set +e
          python seo-system/scripts/self_test.py > seo-system/SELF-TEST-LOG.txt 2>&1
          echo "$?" > seo-system/SELF-TEST-EXIT.txt
          exit 0

      - name: Record validation result
        run: |
          RESULT="FAIL"
          if [ "$(cat seo-system/SELF-TEST-EXIT.txt)" = "0" ]; then RESULT="PASS"; fi
          printf 'OneTap SEO System v1.0\nGenerator and audit self-test: %s\nRequired launch score: 90/100\nCritical findings allowed: 0\n' "$RESULT" > seo-system/SELF-TEST-RESULT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-system/SELF-TEST-RESULT.txt seo-system/SELF-TEST-EXIT.txt seo-system/SELF-TEST-LOG.txt seo-system/examples/sample-site/seo-output
          git commit -m "Record SEO system validation result"
          git push origin HEAD:agent/complete-client-seo-system-v2

name: Run SEO system PR 8 validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-review-branch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out SEO review branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-client-seo-system-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run exact branch self-test
        run: python seo-system/scripts/self_test.py

      - name: Record successful validation
        run: |
          printf 'OneTap SEO System v1.0\nGenerator: PASS\nAudit gate: PASS\nRequired launch score: 90/100\nCritical findings allowed: 0\n' > seo-system/SELF-TEST-PASSED.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-system/SELF-TEST-PASSED.txt seo-system/examples/sample-site/seo-output
          git commit -m "Record SEO system self-test pass"
          git push origin HEAD:agent/complete-client-seo-system-v2

# Second commit intentionally triggers the protected validation run.

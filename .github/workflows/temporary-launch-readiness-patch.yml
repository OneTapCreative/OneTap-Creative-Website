name: Temporary Launch Readiness Patch

on:
  push:
    branches:
      - agent/launch-readiness
    paths:
      - scripts/launch-readiness-patch.py
      - .github/workflows/temporary-launch-readiness-patch.yml

permissions:
  contents: write

jobs:
  patch-static-forms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-readiness
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch static form fallbacks
        run: python scripts/launch-readiness-patch.py
      - name: Commit hardened files and remove temporary runner
        run: |
          rm .github/workflows/temporary-launch-readiness-patch.yml scripts/launch-readiness-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html onboarding/index.html .github/workflows/temporary-launch-readiness-patch.yml scripts/launch-readiness-patch.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Harden static form fallbacks"
          git push origin HEAD:agent/launch-readiness

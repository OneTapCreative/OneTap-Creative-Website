name: Test production lead form

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-form:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Submit labeled test lead
        shell: bash
        run: |
          set -u
          mkdir -p ops/qa
          TEST_ID="ONETAP-FORM-QA-$(date -u +%Y%m%dT%H%M%SZ)"
          LIVE_STATUS=$(curl -sS -o /tmp/live.html -w '%{http_code}' https://onetapcreative.com/ || true)
          FORM_ACTION=$(python - <<'PY'
          from pathlib import Path
          import re
          text = Path('/tmp/live.html').read_text(errors='replace') if Path('/tmp/live.html').exists() else ''
          m = re.search(r'<form[^>]+id=["\']lead-form["\'][^>]+action=["\']([^"\']+)', text, re.I)
          print(m.group(1) if m else '')
          PY
          )

          curl -sS -L \
            -D /tmp/form-headers.txt \
            -o /tmp/form-body.html \
            -w '%{http_code}\n%{url_effective}\n' \
            --data-urlencode "_subject=TEST - OneTap Creative Website Form QA - ${TEST_ID}" \
            --data-urlencode "_template=table" \
            --data-urlencode "_captcha=false" \
            --data-urlencode "_replyto=codicta12@gmail.com" \
            --data-urlencode "_autoresponse=This is an automated OneTap Creative website form test. No response is required." \
            --data-urlencode "_next=https://onetapcreative.com/thank-you.html" \
            --data-urlencode "Website Service=$179/month Complete Online Presence Plan — TEST SUBMISSION" \
            --data-urlencode "Full Name=OneTap Form Test" \
            --data-urlencode "Business Name=OneTap QA Test Business" \
            --data-urlencode "Email=codicta12@gmail.com" \
            --data-urlencode "Phone=209-555-0199" \
            --data-urlencode "Business Type=Other service that needs bookings or quotes" \
            --data-urlencode "Primary Website Goal=Submit a contact form" \
            --data-urlencode "Google Business Profile Status=Not sure" \
            --data-urlencode "Website Goals=TEST ONLY: Verify delivery, formatting, and redirect. Test ID ${TEST_ID}" \
            --data-urlencode "Current Website or Social=https://onetapcreative.com/" \
            --data-urlencode "Preferred Launch Timing=Not sure yet" \
            --data-urlencode "Lead Source=Website QA test" \
            --data-urlencode "Service Terms Accepted=Yes" \
            --data-urlencode "UTM Source=internal-qa" \
            --data-urlencode "UTM Medium=form-test" \
            --data-urlencode "UTM Campaign=hard-launch-qa" \
            --data-urlencode "Landing Page=https://onetapcreative.com/" \
            "${FORM_ACTION:-https://formsubmit.co/clarence.workflow@gmail.com}" \
            > /tmp/curl-summary.txt || true

          FINAL_STATUS=$(sed -n '1p' /tmp/curl-summary.txt)
          FINAL_URL=$(sed -n '2p' /tmp/curl-summary.txt)
          BODY_TEXT=$(python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.parts=[]
              def handle_data(self, data):
                  clean=' '.join(data.split())
                  if clean: self.parts.append(clean)
          p=Parser()
          path=Path('/tmp/form-body.html')
          if path.exists(): p.feed(path.read_text(errors='replace'))
          print(' | '.join(p.parts[:35]))
          PY
          )

          cat > ops/qa/FORM-TEST-RESULT.md <<EOF
          # OneTap Production Form Test

          - Test ID: ${TEST_ID}
          - Tested at UTC: $(date -u +'%Y-%m-%d %H:%M:%S')
          - Live homepage HTTP status: ${LIVE_STATUS}
          - Form action discovered in live HTML: ${FORM_ACTION:-NOT FOUND}
          - Submission final HTTP status: ${FINAL_STATUS:-UNKNOWN}
          - Submission final URL: ${FINAL_URL:-UNKNOWN}
          - Submitted plan: $179/month, three-month minimum
          - Reply-To test address: codicta12@gmail.com
          - CAPTCHA bypassed only for automated delivery verification: yes
          - Response preview: ${BODY_TEXT:-EMPTY}

          Email receipt must be confirmed separately in Gmail.
          EOF

      - name: Commit test result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/qa/FORM-TEST-RESULT.md
          git commit -m "Record production website form test" || exit 0
          git push origin HEAD:main

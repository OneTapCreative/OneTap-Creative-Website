name: Run OneTap $179 pricing update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-pricing-branch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pricing branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-179-pricing
          fetch-depth: 0

      - name: Apply approved pricing model
        run: python scripts/apply-179-pricing.py

      - name: Commit pricing update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html terms.html thank-you.html
          git diff --cached --quiet && exit 0
          git commit -m "Finalize OneTap pricing at $179 per month"
          git push origin HEAD:agent/finalize-179-pricing

# Triggered after workflow activation.

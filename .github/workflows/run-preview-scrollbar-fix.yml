name: Run project preview scrollbar fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/hide-project-preview-scrollbars
          fetch-depth: 0

      - name: Apply reviewed scrollbar fix
        run: python scripts/hide-preview-scrollbars.py

      - name: Commit preview changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Hide project preview scrollbars"
          git push origin HEAD:agent/hide-project-preview-scrollbars
